<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Cultivo - AgroSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern_agro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>
<body class="page-body">
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5 animate-slide-up">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-circle bg-success-soft text-success m-0" style="width: 50px; height: 50px; font-size: 24px;">
                    <i class="bi bi-tree-fill"></i>
                </div>
                <div>
                    <h1 class="dashboard-title m-0 fw-bold" id="header-title">Cargando...</h1>
                    <p class="text-muted m-0 small" id="header-subtitle">Detalles del cultivo</p>
                </div>
            </div>
            <div class="action-bar d-flex flex-nowrap gap-2 overflow-auto pb-1" id="header-actions" style="max-width: 100%;">
                <a href="dashboard.html" class="btn btn-secondary btn-sm rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i> Volver</a>
            </div>
        </div>

        <div class="row g-4">
            <!-- Izquierda: Info & Catálogo -->
            <div class="col-lg-4">
                <div class="agro-card p-4 mb-4" id="crop-info-card">
                    <!-- Skeleton Loader Premium -->
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text" style="width: 50%;"></div>
                    <div class="skeleton skeleton-badge mt-3"></div>
                </div>
                <div id="catalog-info-card"></div>
            </div>

            <!-- Derecha: Clima, IA y Mapa -->
            <div class="col-lg-8">
                <div class="agro-card p-4 mb-4 shadow-sm" style="background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(16,185,129,0.1) 100%); border-left: 4px solid var(--primary-color);">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-cpu-fill text-success fs-4 animate-pulse"></i>
                        <h5 class="m-0 fw-bold text-success">Recomendación Agro IA</h5>
                    </div>
                    <p id="ai-recommendation" class="mb-0 text-dark fw-medium">Analizando datos geoespaciales e instrumentales...</p>
                </div>

                <div class="row g-3 mb-4" id="weather-section" style="display:none;">
                    <!-- Weather cards injected here -->
                </div>

                <div class="agro-card p-4 mb-4 shadow-sm" id="weekly-forecast-section" style="display:none;">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <i class="bi bi-calendar-week-fill text-primary fs-4"></i>
                        <h5 class="m-0 fw-bold text-dark">Pronóstico de la Semana</h5>
                    </div>
                    <div style="position: relative; height: 250px;">
                        <canvas id="weeklyForecastChart"></canvas>
                    </div>
                </div>

                <div class="agro-card p-0 overflow-hidden position-relative shadow-sm" style="height: 480px; border-radius: 20px;">
                    <div class="position-absolute top-0 start-0 w-100 p-3 d-flex justify-content-between pointer-events-none" style="background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 10;">
                        <div>
                            <h5 class="text-white m-0 fw-bold" style="text-shadow: 0 2px 4px rgba(0,0,0,0.8);"><i class="bi bi-cpu-fill text-info me-2"></i>Gemelo Digital Topográfico</h5>
                            <p class="text-white-50 m-0 small" style="text-shadow: 0 1px 2px rgba(0,0,0,0.8);">Mapeo Satelital y Medición Altitudinal</p>
                            <div id="elevation-display" class="mt-2 p-2 rounded border border-info border-opacity-50 shadow-lg pointer-events-auto" style="background: rgba(0,20,40,0.65); backdrop-filter: blur(8px); display: inline-block;">
                                <span class="text-white fw-medium small"><i class="bi bi-rulers text-warning"></i> Altitud en Tiempo Real: </span>
                                <span id="elevation-value" class="text-info fw-bold font-monospace fs-6 ms-1">Escaneando...</span>
                            </div>
                        </div>
                        <div class="text-end pe-3">
                            <span class="badge bg-success-soft text-success border border-success px-3 py-2 fw-bold shadow-lg"><i class="bi bi-check-circle-fill me-1"></i> Telemetría Activa</span>
                        </div>
                    </div>
                    <div id="weather-map" class="w-100 h-100 map-container border-0 m-0" style="border-radius: 20px;">
                        <div class="map-zoom-controls animate-slide-up" style="bottom: 20px; right: 20px; z-index: 10;">
                            <button class="map-zoom-btn shadow" type="button" onclick="if(window.viewer) window.viewer.camera.zoomIn(window.viewer.camera.positionCartographic.height * 0.5);" title="Acercar">+</button>
                            <button class="map-zoom-btn shadow mt-2" type="button" onclick="if(window.viewer) window.viewer.camera.zoomOut(window.viewer.camera.positionCartographic.height * 0.5);" title="Alejar">−</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/crop_catalog.js"></script>
    <script src="js/database.js"></script>
    <script src="js/layout.js"></script>

    <script>
        let crop;
        let detailMarker = null;

        window.addEventListener('unhandledrejection', function (event) {
            if (event.reason) {
                const msg = event.reason.message || '';
                if (msg.includes('Failed to fetch') || msg.includes('NetworkError') ||
                    (typeof event.reason === 'object' && event.reason.statusCode === undefined && event.reason.response === undefined)) {
                    event.preventDefault();
                }
            }
        });

        async function initCropDetail() {
            if (window.initLayout) await window.initLayout('crop_detail');
            await AuthObj.requireAuth();

            const urlParams = new URLSearchParams(window.location.search);
            const cropId = urlParams.get('id');
            const currentUser = await AuthObj.getCurrentUser();
            const allCrops = await window.DB.getAllCrops();
            crop = allCrops.find(c => c.id == cropId);

            if (!crop || (crop.user_id !== currentUser.id && !currentUser.is_superuser)) {
                window.location.href = 'dashboard.html';
                return;
            }

            // Actualizar Cabecera
            document.getElementById('header-title').innerText = crop.name;
            document.getElementById('header-subtitle').innerText = "Registrado el " + new Date(crop.sowing_date).toLocaleDateString();
            
            // Botones de acción en cabecera
            document.getElementById('header-actions').innerHTML = `
                <a href="crop_edit.html?id=${crop.id}" class="btn btn-outline-success btn-sm rounded-pill px-4 fw-bold shadow-sm d-inline-flex align-items-center justify-content-center text-nowrap" style="height: 38px; font-size: 13px;"><i class="bi bi-pencil-fill me-2"></i> Editar</a>
                <a href="abono_application.html?id=${crop.id}" class="btn btn-success btn-sm rounded-pill px-4 fw-bold shadow-sm text-white d-inline-flex align-items-center justify-content-center text-nowrap" style="height: 38px; font-size: 13px; background-color: #10b981; border-color: #10b981;"><i class="bi bi-moisture me-2"></i> Gestionar Abonos</a>
                <button onclick="realDeleteCrop(${crop.id})" class="btn btn-outline-danger btn-sm rounded-pill px-4 fw-bold shadow-sm d-inline-flex align-items-center justify-content-center text-nowrap" style="height: 38px; font-size: 13px;"><i class="bi bi-trash-fill me-2"></i> Eliminar</button>
                <a href="dashboard.html" class="btn btn-outline-secondary btn-sm rounded-pill px-4 fw-bold shadow-sm d-inline-flex align-items-center justify-content-center text-nowrap" style="height: 38px; font-size: 13px;"><i class="bi bi-arrow-left me-2"></i> Volver</a>
            `;

            // Buscar en catálogo
            const normalize = (s) => (s || "").toLowerCase().trim();
            const cName = normalize(crop.name);
            const catalog = window.CROP_CATALOG || {};
            const matchKey = Object.keys(catalog).find(k => normalize(catalog[k].name) === cName);
            const catalogEntry = matchKey ? catalog[matchKey] : null;

            // Info Card (Izquierda)
            // Bento Grid Design & AI Widgets
            document.getElementById('crop-info-card').className = "row g-3 mb-4"; // Convert container to row
            document.getElementById('crop-info-card').innerHTML = `
                <div class="col-12">
                    <div class="agro-card p-3 d-flex justify-content-between align-items-center shadow-sm" style="background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(16,185,129,0.1) 100%);">
                        <h5 class="fw-bold m-0 text-dark"><i class="bi bi-info-circle-fill text-success me-2"></i> Perfil Inteligente</h5>
                        <span class="badge bg-success shadow-sm rounded-pill"><i class="bi bi-check2-circle me-1"></i> Monitoreado</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="agro-card p-3 h-100 text-center shadow-sm border-0">
                        <i class="bi bi-calendar-event fs-3 text-primary mb-2 d-block"></i>
                        <label class="small text-muted fw-bold d-block text-uppercase">Siembra</label>
                        <span class="fw-bold text-dark fs-6">${new Date(crop.sowing_date).toLocaleDateString()}</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="agro-card p-3 h-100 text-center shadow-sm border-0">
                        <i class="bi bi-bounding-box fs-3 text-warning mb-2 d-block"></i>
                        <label class="small text-muted fw-bold d-block text-uppercase">Mapeo</label>
                        <span class="fw-bold text-dark fs-6">${crop.polygon_area ? 'Polígono 3D' : 'Punto Fijo'}</span>
                    </div>
                </div>
                <div class="col-12">
                    <div class="agro-card p-3 shadow-sm border-0">
                        <label class="small text-muted fw-bold mb-2 d-block text-uppercase"><i class="bi bi-card-text me-1"></i> Descripción técnica</label>
                        <p class="mb-0 small text-dark">${crop.description || 'Sin registro técnico.'}</p>
                    </div>
                </div>
                
                <!-- AI WIDGETS (NDVI y Humedad) -->
                <div class="col-12 mt-2">
                    <h6 class="fw-bold text-dark mb-2"><i class="bi bi-cpu text-info me-1"></i> Telemetría Espacial (Tiempo Real)</h6>
                </div>
                <div class="col-6">
                    <div class="agro-card p-3 text-center border-success shadow-sm" style="border-width: 2px;">
                        <div class="fs-4 text-success fw-bold mb-1">0.82</div>
                        <div class="progress" style="height: 6px;"><div class="progress-bar bg-success" style="width: 82%"></div></div>
                        <label class="small text-muted fw-bold mt-2 d-block">NDVI Óptimo</label>
                    </div>
                </div>
                <div class="col-6">
                    <div class="agro-card p-3 text-center border-primary shadow-sm" style="border-width: 2px;">
                        <div class="fs-4 text-primary fw-bold mb-1">68%</div>
                        <div class="progress" style="height: 6px;"><div class="progress-bar bg-primary" style="width: 68%"></div></div>
                        <label class="small text-muted fw-bold mt-2 d-block">Humedad Suelo</label>
                    </div>
                </div>
            `;

            // Catalog Sheet
            if (catalogEntry) {
                document.getElementById('catalog-info-card').innerHTML = `
                    <div class="agro-card p-4">
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <h5 class="m-0 fw-bold">📋 Ficha Técnica</h5>
                            <span class="badge bg-primary bg-opacity-10 text-primary small rounded-pill border border-primary border-opacity-25">Catálogo Oficial</span>
                        </div>
                        <div class="d-flex flex-column gap-3">
                            <div class="d-flex align-items-center gap-3 bg-light-soft p-2 rounded">
                                <div class="fs-3 text-warning"><i class="bi bi-thermometer-half"></i></div>
                                <div>
                                    <div class="small text-muted fw-bold">Temp. Ideal</div>
                                    <div class="fw-bold">${catalogEntry.min_temp}°C - ${catalogEntry.max_temp}°C</div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-3 bg-light-soft p-2 rounded">
                                <div class="fs-3 text-info"><i class="bi bi-droplet-half"></i></div>
                                <div>
                                    <div class="small text-muted fw-bold">Humedad Óptima</div>
                                    <div class="fw-bold">${catalogEntry.min_humidity}% - ${catalogEntry.max_humidity}%</div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-3 bg-light-soft p-2 rounded">
                                <div class="fs-3 text-success"><i class="bi bi-layers"></i></div>
                                <div>
                                    <div class="small text-muted fw-bold">Suelo</div>
                                    <div class="fw-bold text-truncate" title="${catalogEntry.soil_type}" style="max-width: 150px;">${catalogEntry.soil_type}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Initialize Map
            let lat = crop.latitude ? parseFloat(crop.latitude) : 13.7;
            let lng = crop.longitude ? parseFloat(crop.longitude) : -89.2;

            try {
                // Evitar error 401 de Ion quitando la solicitud de tokens y cambiando el proveedor
                Cesium.Ion.defaultAccessToken = null;
                const satelliteProvider = await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer', { maximumLevel: 19 });
                if (satelliteProvider?.errorEvent) satelliteProvider.errorEvent.addEventListener(e => e.retry = false);

                // FIX ERROR 401: Usar ArcGIS Terrain 3D que es gratuito y no requiere Token de Cesium Ion
                let terrainProvider;
                try {
                    terrainProvider = await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
                        'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
                    );
                } catch(e) {
                    console.warn("Fallo cargando el terreno 3D de ArcGIS, usando elipsoide plano por defecto.");
                    terrainProvider = new Cesium.EllipsoidTerrainProvider();
                }

                const viewer = new Cesium.Viewer('weather-map', {
                    animation: false,
                    baseLayerPicker: false,
                    fullscreenButton: false,
                    vrButton: false,
                    geocoder: false,
                    homeButton: false,
                    infoBox: false,
                    sceneModePicker: false,
                    selectionIndicator: false,
                    timeline: false,
                    navigationHelpButton: false,
                    navigationInstructionsInitiallyVisible: false,
                    scene3DOnly: true,
                    terrainProvider: terrainProvider,
                    baseLayer: Cesium.ImageryLayer.fromProviderAsync(Promise.resolve(satelliteProvider))
                });
                window.viewer = viewer;

                viewer.scene.mode = Cesium.SceneMode.SCENE3D;
                viewer.scene.globe.enableLighting = true;
                viewer.scene.globe.depthTestAgainstTerrain = true;
                
                // Lógica Profesional Estática: Medidor de elevación exacto (Pies a Nivel del Mar)
                // Calculamos la altitud específica del centro del terreno y la dejamos fija (No saltos erráticos)
                const posCarto = [Cesium.Cartographic.fromDegrees(lng, lat)];
                Cesium.sampleTerrainMostDetailed(terrainProvider, posCarto).then((updatedPositions) => {
                    const heightMeters = updatedPositions[0].height.toFixed(1);
                    const heightFeet = (updatedPositions[0].height * 3.28084).toFixed(1);
                    const display = document.getElementById('elevation-value');
                    if(display) {
                        display.innerHTML = `${heightMeters} m <span class="text-white-50 mx-1">|</span> ${heightFeet} ft`;
                    }
                }).catch(() => {
                    const display = document.getElementById('elevation-value');
                    if (display) display.innerHTML = "Altitud calculada";
                });

                // DIBUJAR MARCADOR / POLÍGONO CON VUELO CINEMÁTICO
                let detailMarker = null;
                if (crop.polygon_area) {
                    try {
                        const coords = typeof crop.polygon_area === 'string' ? JSON.parse(crop.polygon_area) : crop.polygon_area;
                        if (coords && coords.length >= 3) {
                            const hierarchy = coords.map(pt => Cesium.Cartesian3.fromDegrees(pt.lng, pt.lat));
                            detailMarker = viewer.entities.add({
                                polygon: {
                                    hierarchy: new Cesium.PolygonHierarchy(hierarchy),
                                    material: Cesium.Color.fromCssColorString('#10b981').withAlpha(0.6),
                                    outline: false, 
                                    clampToGround: true // FIX: Evita que el polígono quede enterrado bajo las montañas 3D
                                },
                                position: Cesium.Cartesian3.fromDegrees(coords[0].lng, coords[0].lat),
                                label: { text: crop.name, font: 'bold 14pt Inter', style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 3, outlineColor: Cesium.Color.BLACK, verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -15) }
                            });
                            // Vuelo 3D Centrado Perfecto
                            viewer.flyTo(detailMarker, {
                                offset: new Cesium.HeadingPitchRange(
                                    Cesium.Math.toRadians(0.0), // Heading
                                    Cesium.Math.toRadians(-45.0), // Pitch
                                    2500.0 // Range (distancia)
                                ),
                                duration: 3.0
                            });
                        }
                    } catch (e) { }
                }

                if (!detailMarker) {
                    detailMarker = viewer.entities.add({
                        position: Cesium.Cartesian3.fromDegrees(lng, lat),
                        point: { pixelSize: 18, color: Cesium.Color.fromCssColorString('#10b981'), outlineColor: Cesium.Color.WHITE, outlineWidth: 3, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
                        label: { text: crop.name, font: 'bold 14pt Inter', style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 3, outlineColor: Cesium.Color.BLACK, verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -20), heightReference: Cesium.HeightReference.CLAMP_TO_GROUND }
                    });
                    
                    viewer.flyTo(detailMarker, {
                        offset: new Cesium.HeadingPitchRange(
                            Cesium.Math.toRadians(0.0),
                            Cesium.Math.toRadians(-45.0),
                            3000.0
                        ),
                        duration: 3.0
                    });
                }
            } catch (err) {}

            // Fetch Real Weather (Open-Meteo, Keyless)
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.current) {
                    const temp = data.current.temperature_2m;
                    const hum = data.current.relative_humidity_2m;
                    const rain = data.current.precipitation;
                    const wind = data.current.wind_speed_10m;

                    document.getElementById('weather-section').style.display = 'flex';
                    document.getElementById('weather-section').innerHTML = `
                        <div class="col-md-3 col-6">
                            <div class="agro-card p-3 text-center h-100 d-flex flex-column justify-content-center">
                                <i class="bi bi-thermometer-sun fs-2 text-warning mb-1"></i>
                                <div class="small text-muted fw-bold text-uppercase">Temp</div>
                                <div class="fs-4 fw-bold">${temp}°C</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="agro-card p-3 text-center h-100 d-flex flex-column justify-content-center">
                                <i class="bi bi-droplet-fill fs-2 text-info mb-1"></i>
                                <div class="small text-muted fw-bold text-uppercase">Humedad</div>
                                <div class="fs-4 fw-bold">${hum}%</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="agro-card p-3 text-center h-100 d-flex flex-column justify-content-center">
                                <i class="bi bi-cloud-rain-fill fs-2 text-primary mb-1"></i>
                                <div class="small text-muted fw-bold text-uppercase">Lluvia</div>
                                <div class="fs-4 fw-bold">${rain}<span class="fs-6">mm</span></div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="agro-card p-3 text-center h-100 d-flex flex-column justify-content-center">
                                <i class="bi bi-wind fs-2 text-secondary mb-1"></i>
                                <div class="small text-muted fw-bold text-uppercase">Viento</div>
                                <div class="fs-4 fw-bold">${wind}<span class="fs-6">km/h</span></div>
                            </div>
                        </div>
                    `;

                    // Generate AI Recommendation based on real data
                    if (temp > 30 && rain === 0) {
                        document.getElementById('ai-recommendation').innerHTML = 'Las temperaturas son altas (<b class="text-danger">' + temp + '°C</b>) y no hay lluvia registrada. Se recomienda <span class="text-success fw-bold">aumentar el riego</span> en las próximas horas.';
                    } else if (rain > 0) {
                        document.getElementById('ai-recommendation').innerHTML = 'Hay lluvia registrada en la parcela. <span class="text-danger fw-bold">Suspender riego programado</span> para evitar saturamiento de humedad en el suelo.';
                    } else {
                        document.getElementById('ai-recommendation').innerHTML = 'Condiciones climáticas estables y óptimas. Mantén tu programa de manejo habitual de este cultivo.';
                    }

                    // Render Weekly Forecast Chart
                    if (data.daily) {
                        document.getElementById('weekly-forecast-section').style.display = 'block';
                        const dates = data.daily.time.map(t => new Date(t + 'T12:00:00').toLocaleDateString('es-ES', {weekday: 'short', day: 'numeric'}));
                        const maxTemps = data.daily.temperature_2m_max;
                        const minTemps = data.daily.temperature_2m_min;
                        const precip = data.daily.precipitation_probability_max;

                        const ctxF = document.getElementById('weeklyForecastChart').getContext('2d');
                        new Chart(ctxF, {
                            type: 'line',
                            data: {
                                labels: dates,
                                datasets: [
                                    {
                                        label: 'Máxima (°C)',
                                        data: maxTemps,
                                        borderColor: '#ef4444',
                                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                        borderWidth: 2,
                                        tension: 0.4,
                                        fill: true,
                                        yAxisID: 'y'
                                    },
                                    {
                                        label: 'Mínima (°C)',
                                        data: minTemps,
                                        borderColor: '#3b82f6',
                                        backgroundColor: 'transparent',
                                        borderWidth: 2,
                                        tension: 0.4,
                                        borderDash: [5, 5],
                                        yAxisID: 'y'
                                    },
                                    {
                                        label: 'Lluvia (%)',
                                        data: precip,
                                        type: 'bar',
                                        backgroundColor: 'rgba(14, 165, 233, 0.2)',
                                        borderColor: '#0ea5e9',
                                        borderWidth: 1,
                                        yAxisID: 'y1'
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
                                scales: {
                                    y: {
                                        type: 'linear',
                                        display: true,
                                        position: 'left',
                                        title: { display: true, text: 'Temp (°C)', font: { size: 10 } }
                                    },
                                    y1: {
                                        type: 'linear',
                                        display: true,
                                        position: 'right',
                                        max: 100,
                                        min: 0,
                                        grid: { drawOnChartArea: false },
                                        title: { display: true, text: 'Prob. Lluvia (%)', font: { size: 10 } }
                                    }
                                }
                            }
                        });
                    }
                }
            } catch (e) {
                document.getElementById('ai-recommendation').innerText = 'No se pudo obtener información climática (Error de red).';
            }
        }

        window.realDeleteCrop = async function (id) {
            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: 'Eliminar Cultivo',
                    text: '¿Estás seguro de que quieres eliminar este registro permanentemente?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#dc2626',
                    cancelButtonColor: '#6b7280',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        await window.DB.deleteCrop(id);
                        window.location.href = 'dashboard.html';
                    }
                });
            } else {
                if (confirm('¿Eliminar cultivo?')) {
                    await window.DB.deleteCrop(id);
                    window.location.href = 'dashboard.html';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initCropDetail);
    </script>
</body>
</html>
