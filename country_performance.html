<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempeño del País - AgroSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern_agro.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="page-body">
    <div id="navbar-container"></div>

    <div class="container mt-4 animate-slide-up">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="dashboard-title m-0" style="text-align: left;">
                <i class="bi bi-bar-chart-line-fill me-2" style="color: #10b981;"></i>Desempeño del País
            </h1>
            <div id="country-badge-container"></div>
        </div>

        <div class="row g-4 mb-5">
            <!-- Gráfica de Producción -->
            <div class="col-md-6">
                <div class="agro-card p-4 text-center h-100">
                    <h5 class="fw-bold mb-4">Eficiencia de Cultivos Nacionales</h5>
                    <div style="position: relative; height: 300px;">
                        <canvas id="cropEfficiencyChart"></canvas>
                    </div>
                    <p class="text-muted small mt-3">Distribución de tipos de cultivos en producción activa a nivel nacional.</p>
                </div>
            </div>

            <!-- Gráfica del Clima Nacional -->
            <div class="col-md-6">
                <div class="agro-card p-4 text-center h-100">
                    <h5 class="fw-bold mb-4">Estado Climático Nacional</h5>
                    <div style="position: relative; height: 300px;">
                        <canvas id="climateStatusChart"></canvas>
                    </div>
                    <p class="text-muted small mt-3">Condiciones de humedad y estrés hídrico de todas las parcelas.</p>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="weather-widget d-flex align-items-center justify-content-between p-4 bg-white shadow-sm border-0 rounded-4">
                    <div class="d-flex align-items-center gap-4">
                        <div class="fs-1 text-success">🌱</div>
                        <div>
                            <div class="info-label mb-0 text-muted">Total de Cultivos</div>
                            <div class="fs-4 fw-bold text-dark" id="total-crops">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="weather-widget d-flex align-items-center justify-content-between p-4 bg-white shadow-sm border-0 rounded-4">
                    <div class="d-flex align-items-center gap-4">
                        <div class="fs-1 text-primary">👥</div>
                        <div>
                            <div class="info-label mb-0 text-muted">Usuarios Registrados</div>
                            <div class="fs-4 fw-bold text-dark" id="total-users">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="weather-widget d-flex align-items-center justify-content-between p-4 bg-white shadow-sm border-0 rounded-4">
                    <div class="d-flex align-items-center gap-4">
                        <div class="fs-1 text-warning">⭐</div>
                        <div>
                            <div class="info-label mb-0 text-muted">Nivel de Producción</div>
                            <div class="fs-4 fw-bold text-dark" id="production-level">Estable</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>

    <script>
        async function initCountryPerformance() {
            if (window.initLayout) await window.initLayout('country_performance');
            await AuthObj.requireAuth();

            const user = await AuthObj.getCurrentUser();
            if (user.role !== 'ministry_admin' && user.role !== 'org_admin') {
                window.location.href = 'dashboard.html';
                return;
            }

            const countries = await window.DB.getCountries();
            const myCountry = countries.find(c => String(c.id) === String(user.country_id));
            
            if (myCountry) {
                document.getElementById('country-badge-container').innerHTML = `
                    <span class="badge bg-primary text-white px-3 py-2 fs-6 rounded-pill">
                        <i class="bi bi-geo-alt-fill me-1"></i> ${myCountry.name}
                    </span>
                `;
            }

            const allUsers = await window.DB.getAllUsers(user);
            const countryUsers = allUsers.filter(u => String(u.country_id) === String(user.country_id));
            
            // Obtener cultivos reales de todos los usuarios del país
            const allCrops = await window.DB.getAllCrops(user); // Ministry admin filters by country automatically
            
            let totalCropsCounter = allCrops.length;
            
            // Distribución real
            let cropDistribution = {};
            for (let c of allCrops) {
                let name = c.name ? c.name.trim() : 'Otros';
                name = name.split(' ')[0];
                cropDistribution[name] = (cropDistribution[name] || 0) + 1;
            }
            if(Object.keys(cropDistribution).length === 0) {
                 cropDistribution = { 'Sin Datos': 1 };
            } else {
                 let sorted = Object.entries(cropDistribution).sort((a,b) => b[1]-a[1]);
                 if(sorted.length > 5) {
                     let top4 = sorted.slice(0,4);
                     let others = sorted.slice(4).reduce((acc, val) => acc + val[1], 0);
                     top4.push(['Otros', others]);
                     cropDistribution = Object.fromEntries(top4);
                 }
            }

            document.getElementById('total-users').innerText = countryUsers.length;
            document.getElementById('total-crops').innerText = totalCropsCounter;

            // Chart.js
            const ctx1 = document.getElementById('cropEfficiencyChart').getContext('2d');
            new Chart(ctx1, {
                type: 'pie',
                data: {
                    labels: Object.keys(cropDistribution),
                    datasets: [{
                        data: Object.values(cropDistribution),
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });

            const ctx2 = document.getElementById('climateStatusChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Óptimo', 'Riesgo Moderado', 'Crítico'],
                    datasets: [{
                        data: [75, 15, 10],
                        backgroundColor: ['#34d399', '#fbbf24', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    },
                    cutout: '60%'
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initCountryPerformance);
    </script>
</body>
</html>
